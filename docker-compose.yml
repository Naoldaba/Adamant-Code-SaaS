services:
  db:
    # pgvector/pgvector:pg16 is a drop-in replacement for postgres:16 that ships
    # the `vector` extension used for RAG embedding similarity search.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ac_dev
    ports:
      - "5432:5432"
    volumes:
      - ac_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ac_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgres://postgres:postgres@db:5432/ac_dev
      PASSWORD_SALT: dev_salt_change_me
      SESSION_SECRET: dev_session_secret_change_me
      CORS_ORIGIN: http://localhost:3000
      # Embedding dimension for RAG chunk vectors. Must match the migration column
      # and the configured provider. 768 is what we request from Gemini
      # gemini-embedding-001, and is also valid for the local provider and OpenAI
      # (via its dimensions param). Changing this requires a fresh DB (down -v) +
      # re-ingestion.
      EMBEDDING_DIM: "768"
      # Max Knowledge Uploader file size in MB (oversized uploads are rejected).
      KB_MAX_UPLOAD_MB: "5"
      # RAG retrieval tuning: chunks pulled per question, and the minimum cosine
      # similarity for a chunk to count as relevant. 0.1 suits the offline local
      # provider's low/compressed scores; with a real provider (Gemini/OpenAI)
      # raise it (e.g. 0.5-0.7) for sharper insufficient-knowledge behavior.
      RAG_TOP_K: "6"
      RAG_MIN_SCORE: "${RAG_MIN_SCORE:-0.1}"
      # Provider selection (priority OpenAI > Gemini > offline local). Set one key
      # in a .env file at the repo root (docker compose reads it automatically).
      # Left unset here so the deterministic local provider runs with no secret.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run db:seed && npm --workspace @ac/api run dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: npm --workspace @ac/web run dev

volumes:
  ac_db_data:
